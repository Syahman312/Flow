<style>
:root{--bg:#000;--card:#101113;--card2:#16171a;--line:#24252a;--text:#f3f3f4;--mute:#8d8f97;--faint:#5c5e66;
--today:#2dd4bf;--plan:#60a5fa;--study:#a78bfa;--close:#fbbf24;--habit:#4ade80;--bad:#f87171;--acc:var(--today);
--r:16px;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body[data-tab=plan]{--acc:var(--plan)}body[data-tab=study]{--acc:var(--study)}body[data-tab=close]{--acc:var(--close)}body[data-tab=habits]{--acc:var(--habit)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button,a,input,select,textarea,label,[data-a]{touch-action:manipulation}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.wrap{max-width:680px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.82);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);padding-top:var(--safeT);border-bottom:1px solid transparent}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:58px}
.top h1{font-size:24px;font-weight:750;letter-spacing:-.02em;margin:0;line-height:1.1}
.eyebrow{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;color:var(--mute);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.pill.ok .dot{background:var(--habit)}.pill.busy .dot{background:var(--plan);animation:pulse 1s infinite}.pill.err .dot{background:var(--bad)}.pill.off .dot{background:var(--close)}
@keyframes pulse{50%{opacity:.3}}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mute)}
.icon-btn:active{background:var(--card2)}
.icon-btn svg{width:22px;height:22px}
/* main */
/* main is also .wrap, so set only top/bottom here (the .wrap rule owns the side padding) */
main#view{padding-top:6px;padding-bottom:calc(96px + var(--safeB))}
section{margin:18px 0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:0 0 8px;font-weight:650;display:flex;align-items:center;gap:8px}
h2 .act{margin-left:auto;text-transform:none;letter-spacing:0;font-size:13px;color:var(--acc);font-weight:600;min-height:32px;padding:0 4px}
h3{font-size:16px;margin:0;font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.card.row{border:1px solid var(--line);border-radius:var(--r)}
.muted{color:var(--mute)}.faint{color:var(--faint)}.small{font-size:12.5px}.tiny{font-size:11px}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list .row:last-child{border-bottom:0}
.row:active{background:var(--card2)}
.t-title{font-weight:550;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px;align-items:center}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mute);font-weight:600}
.tag.Work{color:var(--plan)}.tag.ACCA{color:var(--study)}.tag.Personal{color:var(--habit)}.tag.High{color:var(--bad)}
.tag.bad{color:var(--bad);border-color:#4a2222}.tag.good{color:var(--habit)}.tag.warn{color:var(--close)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--faint);flex:none;display:grid;place-items:center;transition:.15s}
.check svg{width:16px;height:16px;opacity:0;stroke:#000;stroke-width:3}
.done .check{background:var(--acc);border-color:var(--acc)}.done .check svg{opacity:1}
.done .t-title{color:var(--faint);text-decoration:line-through}
.check-wrap{min-width:44px;min-height:44px;display:grid;place-items:center;margin:-8px -6px -8px -8px}
.star{min-width:44px;min-height:44px;display:grid;place-items:center;color:var(--faint);font-size:18px;margin:-8px -8px -8px 0}
.star.on{color:var(--close)}
.overdue .meta .d{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600}
a.btn{color:inherit;text-decoration:none}
.btn.pri{background:var(--acc);color:#000;border-color:transparent}
.btn.bad{color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;padding:26px 16px;color:var(--mute)}
.empty .big{font-size:34px;margin-bottom:6px}
.empty p{margin:4px 0 14px}
/* hero */
.hero{display:flex;gap:16px;align-items:center}
.hero .ring{flex:none}
.hero .big{font-size:20px;font-weight:700;letter-spacing:-.01em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line)}
.bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.ring text{font-weight:700;fill:var(--text)}
/* quick add */
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0}
input,select,textarea{background:var(--card2);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:10px 12px;font-size:16px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:88px;resize:vertical}
label.f{display:block;margin:12px 0 0}
label.f>span{display:block;font-size:12.5px;color:var(--mute);margin-bottom:5px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:38px;padding:0 13px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:14px;color:var(--mute)}
.seg button.on{background:var(--acc);color:#000;border-color:transparent;font-weight:650}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.switch input{appearance:none;-webkit-appearance:none;width:50px;min-height:0;height:30px;border-radius:99px;background:var(--line);position:relative;padding:0;flex:none;transition:.2s;border:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked{background:var(--acc)}.switch input:checked::after{left:23px}
/* timeline */
.tl .row{cursor:default}
.tl .time{width:58px;flex:none;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.tl .bar-l{width:3px;align-self:stretch;border-radius:3px;background:var(--acc);flex:none}
.tl .ev .bar-l{background:var(--cal,#6b7280)}
.tl .now{height:2px;background:var(--bad);position:relative;margin:0 12px}
.tl .now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.tl .row.task{cursor:pointer}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:12px;min-height:64px;border:1px solid transparent}
.day .dw{font-size:11px;color:var(--mute);text-transform:uppercase;font-weight:600}
.day .dn{font-size:17px;font-weight:650}
.day .dots{display:flex;gap:2px;height:6px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--acc)}
.day .dots i.e{background:var(--faint)}
.day.sel{background:var(--card2);border-color:var(--line)}
.day.today .dn{color:var(--acc)}
.navrow{display:flex;align-items:center;gap:6px;margin-bottom:8px}
/* timer */
.timer{display:flex;align-items:center;gap:16px}
.timer .tt{font-size:32px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* habits */
.htiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ht{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:96px;display:flex;flex-direction:column;gap:4px;transition:.15s}
.ht .em{font-size:24px}
.ht .nm{font-weight:650;line-height:1.2}
.ht .st{font-size:12px;color:var(--mute)}
.ht.on{background:color-mix(in srgb,var(--hc,var(--habit)) 18%,var(--card));border-color:var(--hc,var(--habit))}
.ht.on::after{content:"✓";position:absolute;top:10px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--hc,var(--habit));color:#000;display:grid;place-items:center;font-weight:800;font-size:13px}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,34px);gap:4px;align-items:center}
.hgrid .hd{font-size:10.5px;color:var(--mute);text-align:center;font-weight:600}
.hdot{width:30px;height:30px;border-radius:9px;background:var(--card2);border:1px solid var(--line);justify-self:center}
.hdot.on{background:var(--hc,var(--habit));border-color:transparent}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;margin-top:10px;overflow-x:auto}
.heat i{width:11px;height:11px;border-radius:3px;background:var(--card2)}
.heat i.on{background:var(--hc,var(--habit))}.heat i.fut{opacity:.25}
/* conf dots */
.conf{display:flex;gap:4px}
.conf button{min-width:30px;min-height:30px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:11px;color:var(--mute);font-weight:700}
.conf button.on{color:#000;border-color:transparent}
.conf .c1.on{background:var(--bad)}.conf .c2.on{background:var(--close)}.conf .c3.on{background:var(--habit)}.conf .c0.on{background:var(--faint)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,10,11,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:var(--safeB)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;min-height:56px;color:var(--faint);font-size:11px;font-weight:600}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected=true]{color:var(--acc)}
.fab{position:fixed;right:max(16px,calc(50vw - 324px));bottom:calc(72px + var(--safeB));z-index:25;width:56px;height:56px;border-radius:18px;background:var(--acc);color:#000;font-size:30px;font-weight:400;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:#0b0b0c;border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:8px 0 calc(20px + var(--safeB))}
.sheet.open{transform:none}
.sheet .wrap{max-width:640px}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2.st{font-size:20px;text-transform:none;letter-spacing:-.01em;color:var(--text);margin:4px 0 6px}
.sheet h3{margin:20px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.sheet .foot{display:flex;gap:8px;margin-top:18px}
.sheet .foot .btn{flex:1}
@media(min-width:760px){.sheet{left:50%;right:auto;width:640px;bottom:auto;top:50%;border-radius:22px;border:1px solid var(--line);transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:.2s}.sheet.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}}
.toast{position:fixed;left:50%;bottom:calc(140px + var(--safeB));transform:translate(-50%,20px);background:#1d1e22;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.logline{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border-bottom:1px solid var(--line);padding:6px 0;overflow-wrap:anywhere}
.logline.error{color:var(--bad)}.logline.warn{color:var(--close)}
.diag li{list-style:none;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.diag{padding:0;margin:8px 0}
.chart{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-size:20px;letter-spacing:-.01em}
.kpi span{font-size:11.5px;color:var(--mute)}
.split{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wdh{font-size:12px;color:var(--mute);padding:10px 12px 4px;font-weight:650;background:var(--card);border-bottom:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:360px){body{font-size:14px}.top h1{font-size:21px}.kpis{grid-template-columns:repeat(2,1fr)}.hgrid{grid-template-columns:minmax(0,1fr) repeat(7,28px);gap:3px}.hdot{width:28px;height:28px}.timer .tt{font-size:26px}.pill{max-width:38vw}}
.tabs .brand,.tabs kbd,.tabs .side-extra{display:none}
.cls.att .check{background:var(--study);border-color:var(--study)}.cls.att .check svg{opacity:1}
.tt-grid{display:none;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:10px}
.tt-col{display:flex;flex-direction:column;gap:5px;min-height:70px}
.tt-d{font-size:11px;font-weight:650;color:var(--mute);text-align:center;text-transform:uppercase;padding-bottom:4px;border-bottom:1px solid var(--line)}.tt-d.today{color:var(--study)}
.tt-c{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;background:color-mix(in srgb,var(--study) 16%,var(--card2));border-left:3px solid var(--study);border-radius:8px;padding:5px 6px;font-size:11.5px;min-width:0}
.tt-c b{font-size:11px;font-weight:700}.tt-c span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}.tt-c.ended{opacity:.45}
@media(min-width:600px){.tt-grid{display:grid}.tt-list{display:none}}
@media(hover:hover){.tt-c:hover{filter:brightness(1.15)}}
.pw{position:relative}.pw input{padding-right:52px}.pw input[type=text]{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.pw .icon-btn{position:absolute;right:0;top:50%;transform:translateY(-50%)}
.cd-n{min-width:52px;text-align:center;flex:none}.cd-n b{display:block;font-size:24px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums}.cd-n span{font-size:10.5px;color:var(--mute)}
.cd-big{min-width:84px;text-align:center;flex:none}.cd-big b{display:block;font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}.cd-big span{font-size:11.5px;color:var(--mute)}
.pdots{display:flex;gap:5px;align-items:center}.pdots i{width:9px;height:9px;border-radius:50%;background:var(--card2);border:1px solid var(--line)}.pdots i.on{background:var(--study);border-color:transparent}.pdots i.cur{border-color:var(--study);box-shadow:0 0 0 2px color-mix(in srgb,var(--study) 30%,transparent)}
.wkdots{display:flex;gap:4px}.wkdots i{width:12px;height:12px;border-radius:4px;background:var(--card2);border:1px solid var(--line)}.wkdots i.on{background:var(--hc,var(--habit));border-color:transparent}
/* touch screens: the content area only scrolls vertically, so sideways swipes always reach the tab-swipe handler */
@media(pointer:coarse){#view{touch-action:pan-y pinch-zoom}}
/* mouse / trackpad */
@media(hover:hover){
  .row[data-a]:hover,.list .row.task:hover{background:var(--card2)}
  .btn:hover{border-color:#3a3b42;filter:brightness(1.08)}
  .seg button:hover,.tabs button:hover,h2 .act:hover{color:var(--text)}
  .seg button.on:hover{color:#000}
  .icon-btn:hover{background:var(--card2);color:var(--text)}
  .fab:hover{filter:brightness(1.08)}
  .ht:hover,.day:hover{border-color:#3a3b42}
  html{scrollbar-color:#2a2b30 transparent}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2b30;border-radius:9px;border:2px solid #000}::-webkit-scrollbar-track{background:transparent}
}
/* phones held sideways: shorter bars so content keeps more height */
@media(orientation:landscape) and (max-height:500px){
  .top .wrap{min-height:46px}.top h1{font-size:20px}
  .tabs button{flex-direction:row;justify-content:center;gap:8px;min-height:44px;padding:0;font-size:12px}
  .tabs svg{width:20px;height:20px}
  main#view{padding-bottom:calc(64px + var(--safeB))}
  .tabs .wrap{padding-right:64px}
  .fab{bottom:calc(var(--safeB) + 1px);right:max(12px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:12px;font-size:24px;box-shadow:none;z-index:31}
  .sheet{max-height:96dvh}
}
/* iPad landscape, laptops, desktops: sidebar + two columns */
@media(min-width:1024px){
  body{padding-left:232px}
  .wrap{max-width:1120px;padding:0 32px}

<script>
'use strict';
/* ================================================================ basics */
const APP_VERSION='2.6.0';
const APP_TITLE='Flow — Today, Plan, Study, Close & Habits';
const $=(s,r=document)=>r.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayS=()=>ymd(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const weekStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
const dayDiff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const fmtDate=s=>{const d=pd(s);return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`};
const relDay=s=>{const n=dayDiff(s,todayS());return n===0?'Today':n===1?'Tomorrow':n===-1?'Yesterday':fmtDate(s)};
const fmtTime=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return `${h}${m?':'+pad(m):''}${ap}`};
const minToT=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const tToMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const ago=ms=>{const s=(Date.now()-ms)/1e3;return s<45?'just now':s<3600?`${Math.round(s/60)}m ago`:s<86400?`${Math.round(s/3600)}h ago`:`${Math.round(s/86400)}d ago`};
const isoLocal=d=>{const o=-d.getTimezoneOffset(),sg=o>=0?'+':'-',a=Math.abs(o);return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:00${sg}${pad(Math.floor(a/60))}:${pad(a%60)}`};
const hrs=m=>{m=Math.round(m);return m<60?`${m}m`:`${Math.floor(m/60)}h${m%60?' '+m%60+'m':''}`};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-2.9 3.8M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.9 0 3.5-.6 4.9-1.4M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg>';
const CHECK='<svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ================================================================ storage */
let storageBroken=false;
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));storageBroken=false;return true}
    catch(e){if(!storageBroken){storageBroken=true;console.error(e);setTimeout(()=>toast('⚠️ Device storage is full — export a backup in Settings'),50)}return false}}
};
const COLS=['tasks','papers','topics','sessions','closeItems','closeLog','habits','habitLog'];
const DEFAULT_HOLIDAYS=[
  {date:'2026-12-25',name:'Christmas Day'},{date:'2027-01-01',name:"New Year's Day"},{date:'2027-02-01',name:'Federal Territory Day'},
  {date:'2027-08-31',name:'National Day'},{date:'2027-09-16',name:'Malaysia Day'},{date:'2027-12-25',name:'Christmas Day'}];
let DB=LS.get('flow2.db',{});COLS.forEach(c=>{if(!DB[c]||typeof DB[c]!=='object')DB[c]={}});
let META=Object.assign({queue:{},fails:{},lastSync:0,lastFull:0,events:[],prefsDirty:false,timer:null,tab:'today',lastSnap:'',backoff:0,lastErr:''},LS.get('flow2.meta',{}));
META.prefs=Object.assign({updated:0,name:'',holidays:DEFAULT_HOLIDAYS,calendars:[],calDefault:true},META.prefs||{});
let CONN=LS.get('flow2.conn',{url:'',key:'',device:''});
let LOGS=LS.get('flow2.log',[]);
// clean up tombstones left by older versions for records that never reached the server
if(!(CONN.url&&CONN.key))COLS.forEach(c=>Object.values(DB[c]).forEach(r=>{if(r.deleted&&!r._pid){delete DB[c][r.id];delete META.queue[c+':'+r.id]}}));
let persistT;
function persist(now){clearTimeout(persistT);const f=()=>{LS.set('flow2.db',DB);LS.set('flow2.meta',META)};now?f():persistT=setTimeout(f,250)}
window.addEventListener('pagehide',()=>persist(true));

/* ================================================================ logging */
function log(level,area,msg,detail){
  const e={t:Date.now(),level,area,msg:String(msg).slice(0,500),detail:detail?String(detail).slice(0,1500):'',sent:level==='info'};
  LOGS.push(e);if(LOGS.length>300)LOGS=LOGS.slice(-300);LS.set('flow2.log',LOGS);
  (level==='error'?console.error:console.log)('[Flow]',area,msg,detail||'');
}
window.addEventListener('error',e=>log('error','app',e.message||'Script error',`${e.filename||''}:${e.lineno||''}`));
window.addEventListener('unhandledrejection',e=>log('error','app',(e.reason&&e.reason.message)||String(e.reason)));

/* ================================================================ records */
const all=col=>Object.values(DB[col]).filter(r=>!r.deleted);
function put(col,rec,opt={}){rec.updated=Date.now();DB[col][rec.id]=rec;META.queue[col+':'+rec.id]=1;persist();scheduleSync(1500);if(!opt.silent)render()}
function remove(col,id,opt={}){const r=DB[col][id];if(!r)return;
  // never reached the server (local-only, or not pushed yet while disconnected): drop it outright instead of keeping a tombstone
  if(!connected()&&!r._pid){delete DB[col][id];delete META.queue[col+':'+id];persist();if(!opt.silent)render();return}
  r.deleted=true;put(col,r,opt)}
const pending=()=>Object.keys(META.queue).length;
const connected=()=>!!(CONN.url&&CONN.key);
// synced settings changed: stamp, queue for the server, save
function savePrefs(){META.prefs.updated=Date.now();META.prefsDirty=true;persist();scheduleSync()}
// hand the user a file
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

/* ================================================================ snapshots (IndexedDB) */
const IDB={
  _db:null,
  open(){return new Promise((res,rej)=>{if(this._db)return res(this._db);if(!window.indexedDB)return rej(new Error('No IndexedDB'));
    const r=indexedDB.open('flow2',1);r.onupgradeneeded=()=>r.result.createObjectStore('snaps',{keyPath:'id'});
    r.onsuccess=()=>{this._db=r.result;res(this._db)};r.onerror=()=>rej(r.error)})},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('snaps',mode);const s=t.objectStore('snaps');const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})},
  put(v){return this.tx('readwrite',s=>s.put(v))},
  del(id){return this.tx('readwrite',s=>s.delete(id))},
  async list(){const db=await this.open();return new Promise((res,rej)=>{const r=db.transaction('snaps').objectStore('snaps').getAll();r.onsuccess=()=>res(r.result.sort((a,b)=>b.id-a.id));r.onerror=()=>rej(r.error)})}
};
async function snapshot(reason){
  try{
    const count=COLS.reduce((n,c)=>n+all(c).length,0);if(!count&&reason==='daily')return;
    await IDB.put({id:Date.now(),reason,count,data:JSON.parse(JSON.stringify(DB)),prefs:META.prefs});
    const list=await IDB.list();for(const s of list.slice(14))await IDB.del(s.id);
  }catch(e){log('warn','backup','Device snapshot failed: '+e.message)}
}

/* ================================================================ server */
const URL_RE=/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/;
function deviceName(){if(!CONN.device){const u=navigator.userAgent;CONN.device=(/iPad/.test(u)?'iPad':/iPhone/.test(u)?'iPhone':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows PC':/Mac/.test(u)?'Mac':'Device')+'-'+Math.random().toString(36).slice(2,5);LS.set('flow2.conn',CONN)}return CONN.device}
async function api(action,payload={},timeout=90000){
  if(!CONN.url)throw new Error('Not connected — add your Web App URL in Settings');
  if(!URL_RE.test(CONN.url))throw new Error('Web App URL must look like https://script.google.com/macros/s/…/exec');
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),timeout);
  try{
    const r=await fetch(CONN.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,key:CONN.key,device:deviceName()},payload)),signal:ctl.signal,redirect:'follow',credentials:'omit',cache:'no-store'});
    if(!r.ok)throw new Error('Server replied '+r.status);
    const text=await r.text();let j;
    try{j=JSON.parse(text)}catch(e){throw new Error(/<html/i.test(text)?'Got a Google page instead of data — set the deployment\'s "Who has access" to Anyone':'Unreadable reply from server')}
    if(!j.ok)throw new Error(j.error||'Unknown server error');
    return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('Timed out — Google took too long to answer');
    if(e instanceof TypeError){if(!navigator.onLine)throw new Error('You are offline');
      // network-level failure: a dropped connection, the device just waking up, or Google answering with an error page.
      // If sync has worked before, the URL is fine, so say so and mark it as transient (the sync loop retries).
      const err=new Error(META.lastSync?'Could not reach Google — connection dropped or Google was busy':'Could not reach the server — check the Web App URL');err.transient=!!META.lastSync;throw err}
    throw e;
  }finally{clearTimeout(tm)}
}

/* ================================================================ sync */
let syncing=false,syncAgain=false,syncT=null;
const BACKOFF=[0,5e3,15e3,6e4,3e5];
function scheduleSync(ms){if(!connected())return;clearTimeout(syncT);syncT=setTimeout(()=>sync(),ms??1500)}
async function sync(opt={}){
  if(!connected()){setStatus();return}
  if(syncing){syncAgain=true;return}
  if(!navigator.onLine){setStatus();return}
  clearTimeout(syncT);syncing=true;setStatus('busy'); // running now, so drop any queued run
  let dirty=false; // only redraw the tab if this sync changed something on screen
  try{
    // 1) push queued changes, in chunks
    const keys=Object.keys(META.queue);
    for(let i=0;i<keys.length;i+=25){
      const chunk=keys.slice(i,i+25).map(k=>{const[col,...rest]=k.split(':');const id=rest.join(':');const rec=DB[col]&&DB[col][id];
        if(!rec){delete META.queue[k];return null}
        const payload=Object.assign({},rec);
        if(col==='tasks'&&rec.date&&rec.time)payload._start=new Date(rec.date+'T'+rec.time).getTime();
        return{k,col,rec:payload,sent:rec.updated}}).filter(Boolean);
      if(!chunk.length)continue;
      const res=await api('push',{changes:chunk.map(c=>({col:c.col,rec:c.rec}))});
      res.results.forEach((r,idx)=>{const c=chunk[idx];if(!c)return;const rec=DB[c.col][c.rec.id];
        if(!r.ok){META.fails[c.k]=(META.fails[c.k]||0)+1;log('error','sync',`Could not save ${c.col} “${c.rec.title||c.rec.id}”`,r.error);return}
        delete META.fails[c.k];
        if(r.calError)log('warn','calendar',`Google Calendar: “${c.rec.title}”`,r.calError);
        if(!rec)return;
        dirty=true;
        if(r.pid)rec._pid=r.pid;
        if(r.eid!==undefined)rec.eid=r.eid;
        if(rec.updated===c.sent){delete META.queue[c.k];if(rec.deleted)delete DB[c.col][rec.id]}
      });
      persist();
    }
    // 2) synced settings
    if(META.prefsDirty){await api('prefs',{prefs:META.prefs});META.prefsDirty=false}
    // 3) pull
    const full=opt.full||!META.lastSync||Date.now()-META.lastFull>864e5;
    const t0=new Date();t0.setHours(0,0,0,0);
    const r=await api('pull',{since:full?0:META.lastSync,full,prefsUpdated:META.prefs.updated,calFrom:addDays(t0,-7).getTime(),calTo:addDays(t0,43).getTime()});
    if(merge(r,full))dirty=true;
    META.lastSync=r.serverTime;if(full)META.lastFull=Date.now();
    META.backoff=0;META.lastErr='';
    // 4) ship device error logs to the server log sheet
    const unsent=LOGS.filter(l=>!l.sent&&l.level!=='info');
    if(unsent.length){try{await api('log',{entries:unsent.slice(-50)});unsent.forEach(l=>l.sent=true);LS.set('flow2.log',LOGS)}catch(e){}}
  }catch(e){
    META.lastErr=e.message;META.backoff=Math.min((META.backoff||0)+1,BACKOFF.length-1);
    // one-off network blips are retried automatically (5s, 15s, 1m…); only record an error if it keeps failing
    if(e.transient&&META.backoff<3)log('info','sync',e.message+' — retrying');
    else log('error','sync',e.transient?e.message+' (still failing after retries)':e.message);
    scheduleSync(BACKOFF[META.backoff]);
  }finally{
    syncing=false;persist();setStatus();if(dirty)render(true);
    if(syncAgain){syncAgain=false;scheduleSync(800)}
  }
}
function merge(r,full){
  let changed=0;
  COLS.forEach(col=>{
    const list=(r.data&&r.data[col])||[];const seen=new Set();
    list.forEach(rec=>{
      seen.add(rec.id);const k=col+':'+rec.id;if(META.queue[k])return;
      const loc=DB[col][rec.id];
      if(!loc||(rec.updated||0)>=(loc.updated||0)){DB[col][rec.id]=Object.assign({},rec);changed++}
    });
    if(full)Object.values(DB[col]).forEach(loc=>{if(loc._pid&&!seen.has(loc.id)&&!META.queue[col+':'+loc.id]){delete DB[col][loc.id];changed++}});
  });
  (r.tombstones||[]).forEach(t=>{if(DB[t.col]&&DB[t.col][t.id]&&!META.queue[t.col+':'+t.id]){delete DB[t.col][t.id];changed++}});
  if(r.prefs&&(r.prefs.updated||0)>(META.prefs.updated||0)&&!META.prefsDirty){META.prefs=Object.assign({},META.prefs,r.prefs);changed++}
  if(r.calendarError)log('warn','calendar','Could not read Google Calendar',r.calendarError);
  if(r.events){if(JSON.stringify(r.events)!==JSON.stringify(META.events))changed++;META.events=r.events;changed+=reconcileEvents()}
  return changed;
}
// Two-way: if a Flow event was moved/renamed in Google Calendar, update the task
function reconcileEvents(){
  let n=0;
  META.events.forEach(ev=>{
    if(!ev.flowId)return;const t=DB.tasks[ev.flowId];if(!t||t.deleted||META.queue['tasks:'+t.id])return;
    if(ev.updated<=(t.updated||0)+60000)return;
    const title=ev.title.replace(/^(✓ )?(📚 )?/,'').trim();let date,time,dur=t.dur;
    if(ev.allDay){date=ev.date;time=''}else{const s=new Date(ev.start);date=ymd(s);time=`${pad(s.getHours())}:${pad(s.getMinutes())}`;dur=Math.round((ev.end-ev.start)/6e4)}
    if(title!==t.title||date!==t.date||time!==(t.time||'')||dur!==t.dur){
      Object.assign(t,{title,date,time,dur});put('tasks',t,{silent:true});n++;log('info','calendar',`Updated “${title}” from Google Calendar`);
    }
  });
  return n;
}
function setStatus(state){

function timeline(d,opt={}){
  const evs=eventsOn(d),tasks=all('tasks').filter(t=>t.date===d),cls=classesOn(d);
  const allDay=evs.filter(e=>e.allDay);
  const items=[...evs.filter(e=>!e.allDay).map(e=>{const s=new Date(e.start);return{k:'e',m:ymd(s)<d?0:s.getHours()*60+s.getMinutes(),end:e.end,e}}),
    ...tasks.filter(t=>t.time).map(t=>({k:'t',m:tToMin(t.time),t})),...cls.map(c=>({k:'c',m:tToMin(c.start),c}))].sort((a,b)=>a.m-b.m);
  const untimed=tasks.filter(t=>!t.time).sort(byTime);
  if(!items.length&&!allDay.length&&(!opt.untimed||!untimed.length))return '';
  const now=new Date(),nowM=d===todayS()?now.getHours()*60+now.getMinutes():-1;let nowDone=nowM<0;
  let h='<div class="list tl">';
  allDay.forEach(e=>h+=`<div class="row ev" style="--cal:${esc(e.color)}"><div class="time">All day</div><div class="bar-l"></div><div class="grow"><div class="t-title">${esc(e.title)}</div><div class="meta">${esc(e.calName)}</div></div></div>`);
  items.forEach(it=>{
    if(!nowDone&&it.m>nowM){h+='<div class="now" aria-label="Now"></div>';nowDone=true}
    if(it.k==='c'){h+=classRow(it.c,d);return}
    if(it.k==='e'){const e=it.e,s=new Date(e.start),en=new Date(e.end);
      h+=`<div class="row ev" style="--cal:${esc(e.color)}"><div class="time">${fmtTime(minToT(ymd(s)<d?0:s.getHours()*60+s.getMinutes()))}</div><div class="bar-l"></div><div class="grow"><div class="t-title">${esc(e.title)}</div><div class="meta">${fmtTime(`${pad(en.getHours())}:${pad(en.getMinutes())}`)} · ${esc(e.calName)}${e.loc?' · '+esc(e.loc):''}</div></div></div>`}
    else{const t=it.t;h+=`<div class="row task ${t.done?'done':''}" data-a="editTask" data-id="${esc(t.id)}"><div class="time">${fmtTime(t.time)}</div><div class="bar-l" style="background:var(--${t.area==='ACCA'?'study':t.area==='Personal'?'habit':'plan'})"></div><div class="grow"><div class="t-title">${esc(t.title)}</div><div class="meta">${t.dur?hrs(t.dur)+' · ':''}${areaTag(t.area)}</div></div><button class="check-wrap" data-a="toggleTask" data-id="${esc(t.id)}" aria-label="Mark done: ${esc(t.title)}"><span class="check">${CHECK}</span></button></div>`}
  });
  if(!nowDone)h+='<div class="now" aria-label="Now"></div>';
  if(opt.untimed)untimed.forEach(t=>h+=taskRow(t));
  return h+'</div>'}

/* ================================================================ TODAY */
function vToday(){
  const t=todayS(),S=stats(),tasks=all('tasks');
  const open=tasks.filter(x=>!x.done&&x.date&&x.date<=t).sort(byTime);
  const doneToday=tasks.filter(x=>x.done&&x.doneAt&&x.doneAt.slice(0,10)===t);
  const habits=activeHabits(),hDone=habits.filter(h=>habitDone(h.id,t)).length;
  const total=open.length+doneToday.length+habits.length,dn=doneToday.length+hDone;
  const top=tasks.filter(x=>x.top&&(!x.done||(x.doneAt||'').slice(0,10)===t)).sort(byTime).slice(0,3);
  const name=META.prefs.name?', '+esc(META.prefs.name):'';

    <div class="grow"><h2 id="h-hero" class="sr">Your day</h2><div class="big">${greet()}${name}</div>

  // Top 3
  h+=`<section aria-labelledby="h-top"><h2 id="h-top">⭐ Top 3 focus</h2>${top.length?`<div class="list">${top.map(x=>taskRow(x,{showDate:true})).join('')}</div>`:`<div class="card muted small">Tap ★ on up to 3 tasks that matter most today.</div>`}</section>`;

  // Tasks
  const od=open.filter(x=>x.date<t),td=open.filter(x=>x.date===t&&!x.time);
  h+=`<section aria-labelledby="h-tasks"><h2 id="h-tasks">Tasks<button class="act" data-a="newTask" data-date="${t}">+ Add</button></h2>`;
  if(od.length)h+=`<div class="list" style="margin-bottom:10px">${od.map(x=>taskRow(x)).join('')}</div>`;
  h+=td.length||doneToday.filter(x=>!x.time).length?`<div class="list">${[...td,...doneToday.filter(x=>!x.time)].map(x=>taskRow(x)).join('')}</div>`:(!od.length?`<div class="card muted small">No untimed tasks for today. 🎯</div>`:'');
  h+='</section>';

  // Habits
  h+=`<section aria-labelledby="h-hab"><h2 id="h-hab">Habits · ${hDone}/${habits.length}<button class="act" data-a="tab" data-tab="habits">All →</button></h2>`+
    (habits.length?`<div class="htiles">${habits.map(x=>habitTile(x,t)).join('')}</div>`:`<div class="card muted small">No habits yet. <button class="act" style="color:var(--acc);font-weight:600" data-a="tab" data-tab="habits">Set some up →</button></div>`)+'</section>';

  // Close + study nudges
  const items=all('closeItems').filter(i=>i.active!==false);
  if(items.length){const p=defaultPeriod(),wd=wdToday(p),done=items.filter(i=>closeDone(p,i.id)).length;
    const dueNow=items.filter(i=>!closeDone(p,i.id)&&wdDate(p,i.wd)<=t);
    if(done<items.length)h+=`<section aria-labelledby="h-close"><h2 id="h-close">🧾 Month-end close</h2><div class="card row" data-a="tab" data-tab="close">${ring(done/items.length,52,6,'var(--close)')}<div class="grow"><div class="t-title">${perLabel(p)} close · ${wd?'WD'+wd+' today':'starts '+relDay(wdDate(p,1))}</div><div class="meta">${done}/${items.length} done${dueNow.length?` · <span class="tag ${dueNow.some(i=>wdDate(p,i.wd)<t)?'bad':'warn'}">${dueNow.length} due</span>`:''}</div></div><span class="muted">›</span></div></section>`}

  // Evening: plan tomorrow / Monday: weekly review
  const hr=new Date().getHours(),tm=ymd(addDays(new Date(),1));
  if(hr>=17){const n=tasks.filter(x=>x.date===tm&&!x.done).length;
    h+=`<section><div class="card"><h3>🌙 Plan tomorrow</h3><p class="muted small" style="margin:6px 0 12px">${n?`${n} task${n>1?'s':''} lined up for tomorrow.`:'Nothing for tomorrow yet. Two minutes now saves twenty in the morning.'}</p><button class="btn sm pri" data-a="planDay" data-date="${tm}">Open tomorrow</button></div></section>`}
  if(new Date().getDay()===1||new Date().getDay()===0)h+=weeklyReview();
  return h}
function weeklyReview(){
  const ws=weekStart(new Date()),from=ymd(addDays(ws,new Date().getDay()===0?0:-7)),to=ymd(addDays(pd(from),6));
  const td=all('tasks').filter(x=>x.done&&x.doneAt&&x.doneAt.slice(0,10)>=from&&x.doneAt.slice(0,10)<=to).length;
  const sm=studyMins(null,from,to);const hb=activeHabits();let hd=0,hp=0;hb.forEach(h=>{for(let i=0;i<7;i++)if(habitDone(h.id,ymd(addDays(pd(from),i))))hd++;hp+=h.target||7});

/* ---------- focus timer */
function timerLeft(){const T=META.timer;if(!T)return 0;return T.paused!=null?T.paused:Math.max(0,T.start+T.dur*6e4-Date.now())}
function timerCard(){
  const T=META.timer,P=POMO(),papers=all('papers').filter(p=>!isDoneSubj(p)),ft=focusToday();
  const today=`<div class="tiny muted" style="margin-top:10px">Today: 🍅 ${ft.n} focus session${ft.n===1?'':'s'}${ft.mins?' · '+hrs(ft.mins)+' logged':''}</div>`;
  const dots=(r,brk)=>`<div class="pdots" aria-label="Round ${r} of ${P.every}">${[...Array(P.every)].map((_,i)=>`<i class="${i<r-1||(brk&&i===r-1)?'on':''}${i===r-1&&!brk?' cur':''}"></i>`).join('')}</div>`;
  const pick=`<label class="f"><span>Studying</span><select id="timerPaper"><option value="">Nothing specific — just focus</option>${papers.map(p=>paperOpt(p,META.lastTimerPaper)).join('')}</select></label>`;
  if(!T&&META.timerNext){const N=META.timerNext,p=N.paper&&paperOf(N.paper);
    return `<div class="card"><div class="split"><h3>Break's over</h3>${dots(N.round,false)}</div><p class="muted small" style="margin:6px 0 0">Round ${N.round} of ${P.every}${p?' · '+subjIcon(p)+esc(p.code):''}</p>
      <div class="btns" style="margin-top:12px"><button class="btn sm pri" data-a="nextRound">▶ Start round ${N.round}</button><button class="btn sm" data-a="endPomo">Done for now</button></div>${today}</div>`}
  if(!T)return `<div class="card"><div class="split"><div class="muted small">Pomodoro: ${P.focus} min focus, ${P.short} min break, ${P.long} min break after every ${P.every}. Time on a subject is logged to Study.</div><button class="icon-btn" data-a="pomoSettings" aria-label="Timer settings" style="flex:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button></div>
    <div class="seg" style="margin-top:10px" role="group" aria-label="Session length"><button data-a="startTimer" data-m="${P.focus}" class="on">🍅 ${P.focus} min</button>${[45,60].filter(m=>m!==P.focus).map(m=>`<button data-a="startTimer" data-m="${m}">${m} min</button>`).join('')}</div>
    ${papers.length?pick:''}${today}</div>`;
  const left=timerLeft(),pct=1-left/(T.dur*6e4),p=T.paper&&paperOf(T.paper),brk=T.mode==='break',r=T.round||1;
  return `<div class="card"><div class="timer"><div id="timerRing">${ring(pct,84,8,brk?'var(--habit)':'var(--study)',' ')}</div><div class="grow"><div class="split"><div class="tt" id="timerTxt" aria-live="off">${fmtLeft(left)}</div>${dots(r,brk)}</div>
    <div class="muted small">${brk?(T.long?'Long break — walk, water, rest your eyes':'Short break — stretch, water, eyes off the screen'):(p?subjIcon(p)+esc(p.code)+(T.topic&&DB.topics[T.topic]?' · '+esc(DB.topics[T.topic].title):p.title!==p.code?' · '+esc(p.title):''):'Focus session')} · round ${r}/${P.every}</div>
    <div class="btns" style="margin-top:10px"><button class="btn sm" data-a="pauseTimer">${T.paused!=null?'Resume':'Pause'}</button><button class="btn sm" data-a="addFive">+5 min</button>${brk?'<button class="btn sm" data-a="skipBreak">Skip break</button>':''}<button class="btn sm bad" data-a="stopTimer">Stop</button></div></div></div>${today}</div>`}
function startFocus(m,paper,topic,round){META.timer={mode:'focus',start:Date.now(),dur:m,paper:paper||'',topic:topic||'',paused:null,round:round||1};META.timerNext=null;persist();buzz();render();toast(`🍅 Focus ${m} min — round ${round||1}`)}
function pomoSheet(){const P=POMO(),n=(id,v,mn,mx)=>`<input id="${id}" type="number" inputmode="numeric" min="${mn}" max="${mx}" value="${v}">`;
  openSheet(`<h2 class="st" id="sheetTitle">Pomodoro timer</h2><p class="muted small">The classic is 25 min focus, 5 min break, and a 15–30 min break after every 4 rounds.</p>
  <div class="grid2"><label class="f"><span>Focus (min)</span>${n('pm_focus',P.focus,5,120)}</label><label class="f"><span>Short break (min)</span>${n('pm_short',P.short,1,30)}</label></div>
  <div class="grid2"><label class="f"><span>Long break (min)</span>${n('pm_long',P.long,5,60)}</label><label class="f"><span>Long break every</span>${n('pm_every',P.every,2,8)}</label></div>

const fmtLeft=ms=>{const s=Math.ceil(ms/1e3);return `${pad(Math.floor(s/60))}:${pad(s%60)}`};
function timerTick(){
  const T=META.timer;if(!T)return;const left=timerLeft();
  const el=$('#timerTxt');if(el)el.textContent=fmtLeft(left);
  const rg=$('#timerRing');if(rg&&(Date.now()/1e3|0)%5===0)rg.innerHTML=ring(1-left/(T.dur*6e4),84,8,T.mode==='break'?'var(--habit)':'var(--study)',' ');
  if(T.paused==null)document.title=`${fmtLeft(left)} · Flow`;
  if(left<=0&&T.paused==null)finishTimer();
}
setInterval(timerTick,1000);
function finishTimer(partialMins){
  const T=META.timer;if(!T)return;META.timer=null;document.title=APP_TITLE;
  const P=POMO(),r=T.round||1;
  if(T.mode==='focus'){
    const mins=partialMins??T.dur;
    if(T.paper&&mins>=1){const p=paperOf(T.paper);put('sessions',{id:uid(),title:`${p?p.code:'Study'} · ${mins} min`,paper:T.paper,topic:T.topic||'',date:ymd(new Date(T.start)),mins,kind:'Focus'},{silent:true})}
    if(partialMins==null){const long=r%P.every===0;buzz([80,60,80]);confetti();
      notify(`Round ${r} done 🍅`,`${T.paper?mins+' min logged to Study. ':''}${long?`Long break: ${P.long} min`:`Break: ${P.short} min`}`);
      META.timer={mode:'break',start:Date.now(),dur:long?P.long:P.short,paper:T.paper||'',topic:T.topic||'',paused:null,round:r,long}}
    else META.timerNext=null;
    toast(T.paper?`✅ ${mins} min logged · +${Math.round(mins/2)} XP`:'✅ Focus session done');
  }else{
    const next={round:T.long?1:r+1,paper:T.paper||'',topic:T.topic||''};
    notify('Break over',`Ready for round ${next.round}?`);buzz(40);
    if(P.auto){persist();startFocus(P.focus,next.paper,next.topic,next.round);return}
    META.timerNext=next}
  persist();render()}
function notify(title,body){try{if('Notification'in window&&Notification.permission==='granted'&&document.visibilityState!=='visible')new Notification(title,{body,icon:'icon-192.png'})}catch(e){}}

  const delta=(a,b,f=x=>x)=>a===b?'<span class="faint">same as last week</span>':`<span style="color:var(${a>b?'--habit':'--bad'})">${a>b?'▲':'▼'} ${f(Math.abs(a-b))}</span> <span class="faint">vs last week</span>`;

  // study
  const mins=[...Array(7)].map((_,i)=>W.ss.filter(s=>s.date===ymd(addDays(ws,i))).reduce((a,s)=>a+(+s.mins||0),0));

    ${examList().slice(0,1).map(p=>`<div class="list" style="margin-top:10px">${countdownRow(p)}</div>`).join('')}</section>`;

  const open=all('tasks').filter(x=>!x.done&&x.date&&x.date>=from&&x.date<=to&&x.date<t).sort(byTime);

    ${open.length?`<h2 style="margin-top:14px">Still open from this week · ${open.length}<button class="act" data-a="revCarry" data-from="${from}" data-to="${to}">Move all to today</button></h2><div class="list">${open.slice(0,8).map(x=>taskRow(x,{showDate:true,star:false})).join('')}</div>${open.length>8?`<p class="tiny muted">+${open.length-8} more</p>`:''}`:''}</section>`;
  // reflection
  const q=(id,lab,ph,v)=>`<label class="f"><span>${lab}</span><textarea id="${id}" maxlength="400" rows="3" placeholder="${ph}">${esc(v||'')}</textarea></label>`;
  h+=`<section aria-labelledby="h-rr"><h2 id="h-rr">Reflect</h2><div class="card">${q('rv_well','What went well?','e.g. Finished IC recs a day early, 3 SBR sessions',rv.well)}${q('rv_block','What got in the way?','e.g. Late nights at close, skipped revision on Wednesday',rv.block)}${q('rv_focus','Focus for next week','e.g. IFRS 16 question bank + 2 mock questions',rv.focus)}

    <p class="tiny muted" style="margin-bottom:0">Your “focus for next week” shows on Today all next week.</p></div></section>`;
  return h}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSheet();return}
  // shortcuts for keyboards (PC, iPad, Android tablets): 1–5 switch tabs, N adds, / jumps to quick add
  if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
  const el=document.activeElement;if(el&&(/INPUT|TEXTAREA|SELECT/.test(el.tagName)||el.isContentEditable))return;
  if($('#sheet').classList.contains('open'))return;
  const tabs=['today','plan','study','close','habits'];
  if(/^[1-5]$/.test(e.key)){e.preventDefault();A.tab({tab:tabs[+e.key-1]})}
  else if(e.key==='n'||e.key==='N'){e.preventDefault();A.fab()}
  else if(e.key==='r'||e.key==='R'){e.preventDefault();A.openReview()}
  else if(e.key==='/'){const q=$('#view form[data-form=quick] input');if(q){e.preventDefault();q.focus()}}
});

function parseQuick(s,baseDate){
  let t=' '+s+' ',date='',time='',area='',prio='Medium';const now=new Date();
  t=t.replace(/\s#(work|acca|personal)\b/i,(m,a)=>{area=a.toLowerCase()==='acca'?'ACCA':a[0].toUpperCase()+a.slice(1).toLowerCase();return' '});
  t=t.replace(/\s!(high|h|med|medium|low|l)\b/i,(m,a)=>{prio=/^h/i.test(a)?'High':/^l/i.test(a)?'Low':'Medium';return' '});
  t=t.replace(/\s(today|tdy)\b/i,()=>{date=ymd(now);return' '});
  t=t.replace(/\s(tomorrow|tmrw|tmr|esok)\b/i,()=>{date=ymd(addDays(now,1));return' '});
  t=t.replace(/\s(?:on\s)?(mon(?:day)?|tue(?:s(?:day)?)?|wed(?:nesday)?|thu(?:rs(?:day)?)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)\b/i,(m,a)=>{const i=['sun','mon','tue','wed','thu','fri','sat'].indexOf(a.slice(0,3).toLowerCase());date=ymd(addDays(now,(i-now.getDay()+7)%7));return' '});
  t=t.replace(/\s(\d{1,2})\/(\d{1,2})\b/,(m,d,mo)=>{let y=now.getFullYear();const c=new Date(y,mo-1,d);if(c<addDays(now,-1))y++;date=ymd(new Date(y,mo-1,d));return' '});
  t=t.replace(/\s(?:at\s)?(\d{1,2})(?::(\d{2}))?\s?(am|pm)\b/i,(m,h,mi,ap)=>{h=+h%12+(ap.toLowerCase()==='pm'?12:0);time=`${pad(h)}:${mi||'00'}`;return' '});
  if(!time)t=t.replace(/\s(?:at\s)?([01]?\d|2[0-3]):([0-5]\d)\b/,(m,h,mi)=>{time=`${pad(+h)}:${mi}`;return' '});
  if(!area)area=/\b(acca|sbr|sbl|afm|apm|atx|aaa|revision|mock|syllabus|kaplan|bpp)\b/i.test(s)?'ACCA':'Work';
  return{title:t.replace(/\s+/g,' ').trim(),date:date||(baseDate??ymd(now)),time,area,prio}}

async function runDiag(){
  const out=$('#diagOut');const L=[];
  const add=(ok,name,d)=>L.push(`<li>${ok?'✅':'❌'} ${esc(name)}${d?` <span class="muted small">— ${esc(d)}</span>`:''}</li>`);
  add(location.protocol==='https:'||location.hostname==='localhost','HTTPS',location.protocol);
  add('serviceWorker'in navigator&&!!navigator.serviceWorker.controller,'Offline support',navigator.serviceWorker&&navigator.serviceWorker.controller?'active':'reload once to activate');
  add(!storageBroken,'Device storage',`${Math.round(JSON.stringify(DB).length/1024)} KB used`);
  add(navigator.onLine,'Internet',navigator.onLine?'online':'offline');
  add(URL_RE.test(CONN.url),'Web App URL format',CONN.url?'':'missing');
  out.innerHTML=`<ul class="diag">${L.join('')}<li class="muted">Checking server…</li></ul>`;
  try{const r=await api('diag',{},60000);r.checks.forEach(c=>add(c.ok,c.name,c.detail));add(true,'Bridge version',r.version+' · '+r.tz)}
  catch(e){add(false,'Server',e.message)}
  UI.diag=`<ul class="diag">${L.join('')}</ul>`;out.innerHTML=UI.diag}

/* ---------- backup helpers */
function exportData(){
  const data={};COLS.forEach(c=>data[c]=all(c));
  download(`flow-backup-${todayS()}.json`,JSON.stringify({app:'Flow',version:2,exported:new Date().toISOString(),prefs:META.prefs,data},null,1),'application/json');
  log('info','backup','Exported JSON backup');toast('Backup downloaded')}
async function restoreData(obj,source){
  if(!obj||obj.app!=='Flow'||!obj.data)throw new Error('This is not a Flow backup file');
  const count=COLS.reduce((n,c)=>n+((obj.data[c]||[]).length||Object.keys(obj.data[c]||{}).length),0);
  if(!confirm(`Restore ${count} records from ${source}?\n\nThis replaces what's on this device${connected()?' and in your Google Sheet':''}. A snapshot of the current data is saved first.`))return;
  await snapshot('before restore');
  const old=DB;DB={};
  COLS.forEach(c=>{DB[c]={};const list=Array.isArray(obj.data[c])?obj.data[c]:Object.values(obj.data[c]||{});
    list.forEach(r=>{if(r&&r.id&&!r.deleted){DB[c][r.id]=Object.assign({},r);META.queue[c+':'+r.id]=1}});
    Object.values(old[c]||{}).forEach(r=>{if(!DB[c][r.id]&&r._pid){DB[c][r.id]=Object.assign({},r,{deleted:true});META.queue[c+':'+r.id]=1}})});
  const now=Date.now();COLS.forEach(c=>Object.values(DB[c]).forEach(r=>r.updated=now));
  if(obj.prefs){META.prefs=Object.assign({},META.prefs,obj.prefs,{updated:now});META.prefsDirty=true}
  persist(true);log('info','backup',`Restored ${count} records from ${source}`);closeSheet();render();toast('Restored ✓');scheduleSync(300)}

  saveHabit:d=>{const t=val('h_title');if(!t){toast('Name the habit');return}const tv=segVal('htarget');const h=d.id?DB.habits[d.id]:{id:uid(),order:all('habits').length,archived:false};
    Object.assign(h,{title:t,icon:val('h_icon')||'✨',target:tv==='Daily'?7:parseInt(tv)||7,color:segVal('hcolor')||'#4ade80'});closeSheet();put('habits',h);toast('Saved')},
  archHabit:d=>{if(confirm('Archive this habit? Its history is kept.')){const h=DB.habits[d.id];h.archived=true;closeSheet();put('habits',h)}},
  starterHabits:()=>{STARTER_HABITS.forEach(([icon,title,target,color],k)=>put('habits',{id:uid(),title,icon,target,color,order:k,archived:false},{silent:true}));render();toast('Added — edit or archive any of them')},
  // settings
  saveSettings:()=>{const n=val('s_name');const cd=$('#s_caldef').checked;if(n!==(META.prefs.name||'')||cd!==!!META.prefs.calDefault){META.prefs.name=n;META.prefs.calDefault=cd;savePrefs()}closeSheet();render()},
  // show / hide the app key; hides itself again after 30 s so it isn't left on screen
  toggleKey:(d,el)=>{const i=$('#s_key');if(!i)return;const show=i.type==='password';i.type=show?'text':'password';el.setAttribute('aria-pressed',show);el.setAttribute('aria-label',show?'Hide app key':'Show app key');el.innerHTML=show?EYE_OFF:EYE;
    clearTimeout(i._hide);if(show)i._hide=setTimeout(()=>{if(i.isConnected&&i.type==='text')A.toggleKey({},el)},30000)},
  saveConn:async()=>{const url=val('s_url'),key=val('s_key');
    if(url&&!URL_RE.test(url)){toast('That URL should end in /exec and start with https://script.google.com/',4000);return}
    CONN={url,key,device:val('s_dev')||deviceName()};LS.set('flow2.conn',CONN);META.lastErr='';
    if(!url){setStatus();toast('Disconnected — data stays on this device');return}
    toast('Connecting…',8000);
    try{const r=await api('ping');if(!r.setup)throw new Error('Connected, but run setup() in Apps Script first');toast('✅ Connected — syncing');log('info','sync','Connected to bridge v'+r.version);META.lastFull=0;await sync({full:true});settingsSheet()}
    catch(e){META.lastErr=e.message;log('error','sync','Connect failed',e.message);toast('❌ '+e.message,5000);setStatus()}},
  diag:()=>runDiag(),
  syncNow:async()=>{await sync();settingsSheet()},fullSync:async()=>{await sync({full:true});settingsSheet()},
  discardFails:()=>{if(!confirm('Discard the changes that keep failing? They will be undone on this device at the next full sync.'))return;Object.keys(META.fails).forEach(k=>delete META.queue[k]);META.fails={};META.lastFull=0;persist();sync({full:true});settingsSheet()},
  loadCals:async()=>{const box=$('#calList');box.innerHTML='<p class="small muted">Loading calendars…</p>';
    try{const r=await api('calendars');const sel=new Set(META.prefs.calendars||[]);const useDef=!sel.size;
      box.innerHTML=`<div class="list">${r.calendars.map(c=>`<label class="row" style="cursor:pointer"><span style="width:12px;height:12px;border-radius:4px;background:${esc(c.color)};flex:none"></span><span class="grow small">${esc(c.name)}${c.flow?' <span class="tag">Flow</span>':''}${c.primary?' <span class="tag">main</span>':''}</span><input type="checkbox" class="calpick" value="${esc(c.id)}" ${(useDef?(c.primary||c.flow):sel.has(c.id))?'checked':''} ${c.flow?'disabled':''} style="width:22px;min-height:22px;accent-color:var(--acc)"></label>`).join('')}</div><button class="btn sm pri" style="margin-top:8px" data-a="saveCals">Save calendars</button>`}
    catch(e){box.innerHTML=`<p class="small" style="color:var(--bad)">${esc(e.message)}</p>`;log('error','calendar','List calendars failed',e.message)}},
  saveCals:()=>{META.prefs.calendars=[...document.querySelectorAll('.calpick:checked')].map(c=>c.value);savePrefs();toast('Saved — refreshing events');sync()},
  export:()=>exportData(),import:()=>$('#fileIn').click(),
  driveBackup:async()=>{toast('Backing up to Google Drive…',8000);try{const r=await api('backup',{},120000);toast(`☁ Saved ${r.file.name} (${r.file.records} records)`,3500)}catch(e){log('error','backup','Drive backup failed',e.message);toast('Backup failed: '+e.message,4500)}},
  driveList:async()=>{const out=$('#backupOut');out.innerHTML='<p class="small muted">Loading backups…</p>';
    try{const r=await api('backups');out.innerHTML=r.backups.length?`<div class="list" style="margin-top:8px">${r.backups.map(b=>`<div class="row" data-a="driveRestore" data-id="${esc(b.id)}"><div class="grow small">${esc(b.name.replace('flow-backup-','').replace('.json',''))}</div><span class="tiny muted">${Math.round(b.size/1024)} KB</span><span class="act" style="color:var(--acc);font-size:13px">Restore</span></div>`).join('')}</div>`:'<p class="small muted">No Drive backups yet.</p>'}
    catch(e){out.innerHTML=`<p class="small" style="color:var(--bad)">${esc(e.message)}</p>`;log('error','backup','List backups failed',e.message)}},
  driveRestore:async d=>{try{toast('Downloading backup…');const r=await api('backupGet',{fileId:d.id});await restoreData(r.backup,'Google Drive')}catch(e){log('error','backup','Drive restore failed',e.message);toast(e.message,4000)}},
  snaps:async()=>{const out=$('#backupOut');try{const list=await IDB.list();out.innerHTML=list.length?`<div class="list" style="margin-top:8px">${list.map(s=>`<div class="row" data-a="snapRestore" data-id="${s.id}"><div class="grow small">${new Date(s.id).toLocaleString()}<div class="meta">${esc(s.reason)} · ${s.count} records</div></div><span class="act" style="color:var(--acc);font-size:13px">Restore</span></div>`).join('')}</div>`:'<p class="small muted">No snapshots yet — one is taken each day you open Flow.</p>'}catch(e){out.innerHTML=`<p class="small" style="color:var(--bad)">${esc(e.message)}</p>`}},
  snapRestore:async d=>{const s=(await IDB.list()).find(x=>x.id===+d.id);if(!s)return;const data={};COLS.forEach(c=>data[c]=Object.values(s.data[c]||{}).filter(r=>!r.deleted));try{await restoreData({app:'Flow',data,prefs:s.prefs},'device snapshot')}catch(e){toast(e.message)}},
  moreLogs:()=>{UI.logs=!UI.logs;settingsSheet()},
  exportLogs:()=>download(`flow-logs-${todayS()}.txt`,LOGS.map(l=>`${new Date(l.t).toISOString()}\t${l.level}\t${l.area}\t${l.msg}\t${l.detail||''}`).join('\n'),'text/plain'),
  clearLogs:()=>{LOGS=[];LS.set('flow2.log',LOGS);settingsSheet()},
  notifPerm:async()=>{if(!('Notification'in window)){toast('This browser has no notifications — on iPhone, add Flow to your Home Screen first');return}const p=await Notification.requestPermission();toast(p==='granted'?'🔔 Timer alerts on':'Notifications not allowed')},
  resetDevice:async()=>{if(!confirm(`Erase Flow data on this device?${pending()?`\n\n⚠️ ${pending()} change(s) haven't synced and will be lost.`:''}\n\nYour Google Sheet and Drive backups are not touched.`))return;await snapshot('before reset');['flow2.db','flow2.meta'].forEach(k=>localStorage.removeItem(k));location.reload()},
};

/* ================================================================ events */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;if(!A[a])return;
  if(el.tagName==='A')return;
  e.preventDefault();e.stopPropagation();
  try{const r=A[a](el.dataset,el,e);if(r&&r.catch)r.catch(err=>{log('error','action:'+a,err.message);toast(err.message)})}
  catch(err){log('error','action:'+a,err.message,err.stack);toast('Something went wrong — see Settings → Logs')}
});
document.addEventListener('submit',e=>{
  const f=e.target;if(f.dataset.form!=='quick')return;e.preventDefault();
  const q=f.q.value.trim();if(!q)return;
  const p=parseQuick(q,f.dataset.date);if(!p.title){toast('Add a task name');return}
  put('tasks',{id:uid(),title:p.title,date:p.date,time:p.time,dur:p.time?60:30,area:p.area,prio:p.prio,repeat:'none',paper:'',done:false,top:false,cal:!!(p.time&&META.prefs.calDefault&&connected()),notes:''});
  toast(`Added for ${relDay(p.date).toLowerCase()}${p.time?' at '+fmtTime(p.time):''}`);
  setTimeout(()=>{const i=$('#'+f.querySelector('input').id);if(i)i.focus()},30);
});
document.addEventListener('change',e=>{if(e.target.id==='l_paper')logTopics()});
$('#fileIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>20e6){toast('File too large');return}
  try{await restoreData(JSON.parse(await f.text()),f.name)}catch(err){log('error','import','Import failed: '+f.name,err.message);toast('Import failed: '+err.message,4000)}});

/* ================================================================ swipe between tabs (touch screens) */
(()=>{
  const ORDER=['today','plan','study','close','habits'],view=$('#view');
  const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  let sx=0,sy=0,dx=0,mode='off',busy=false,trail=[];
  // don't steal swipes from things that scroll sideways themselves (e.g. the habit history grid)
  const inHScroll=el=>{for(;el&&el!==view;el=el.parentElement)if(el.scrollWidth>el.clientWidth+2&&/(auto|scroll)/.test(getComputedStyle(el).overflowX))return true;return false};
  view.addEventListener('touchstart',e=>{
    mode='off';
    if(busy||e.touches.length!==1||$('#sheet').classList.contains('open')||!ORDER.includes(META.tab))return;
    const t=e.touches[0];
    if(t.clientX<24||t.clientX>innerWidth-24)return;               // leave screen edges to the browser's back/forward gesture
    if(e.target.closest('input,textarea,select,[contenteditable]')||inHScroll(e.target))return;
    sx=t.clientX;sy=t.clientY;dx=0;trail=[[performance.now(),0]];mode='wait';
  },{passive:true});
  view.addEventListener('touchmove',e=>{
    if(mode==='off'||busy)return;
    const t=e.touches[0],x=t.clientX-sx,y=t.clientY-sy;
    if(mode==='wait'){if(Math.abs(x)<10&&Math.abs(y)<10)return;
      if(Math.abs(x)<=Math.abs(y)*1.2){mode='off';return}         // mostly vertical: let the page scroll
      mode='h';view.style.transition='none'}
    e.preventDefault();
    const i=ORDER.indexOf(META.tab),edge=(x>0&&i<=0)||(x<0&&i===ORDER.length-1);
    dx=edge?x/3:x;                                                  // rubber-band at the first/last tab
    const now=performance.now();trail.push([now,x]);while(trail.length>2&&now-trail[0][0]>120)trail.shift();
    if(!reduce())view.style.transform=`translateX(${dx}px)`;
  },{passive:false});
  const spring=()=>{view.style.transition='transform .25s cubic-bezier(.2,.8,.2,1)';view.style.transform=''};
  const show=tab=>{META.tab=tab;persist();render();scrollTo(0,0);buzz(8)};
  function go(tab,dir){
    if(reduce()){view.style.transform='';show(tab);return}
    busy=true;const w=view.offsetWidth;
    view.style.transition='transform .15s ease-in';view.style.transform=`translateX(${-dir*w}px)`;
    setTimeout(()=>{show(tab);view.style.transition='none';view.style.transform=`translateX(${dir*w*.3}px)`;void view.offsetWidth;
      view.style.transition='transform .24s cubic-bezier(.2,.8,.2,1)';view.style.transform='';
      setTimeout(()=>{busy=false;view.style.transition=''},260)},150)}
  view.addEventListener('touchend',()=>{
    if(mode!=='h'){mode='off';return}mode='off';
    const i=ORDER.indexOf(META.tab),w=view.offsetWidth,a=trail[0],z=trail[trail.length-1];
    const v=(z[1]-a[1])/Math.max(16,z[0]-a[0]),far=Math.min(w*.22,160),flick=Math.abs(dx)>40&&Math.abs(v)>.5; // speed over the last ~120ms only
    const dir=dx<-far||(flick&&v<0)?1:dx>far||(flick&&v>0)?-1:0,next=dir&&ORDER[i+dir];
    next?go(next,dir):spring();
  });
  view.addEventListener('touchcancel',()=>{if(mode==='h')spring();mode='off'});
  // one-time hint on touch devices
  if(matchMedia('(pointer:coarse)').matches&&!META.swipeTip)setTimeout(()=>{toast('Tip: swipe left or right to switch tabs',3500);META.swipeTip=1;persist()},1800);
})();

/* ================================================================ boot */
{const qt=new URLSearchParams(location.search).get('tab');if(VIEWS[qt])META.tab=qt}
render();
if(META.timer&&timerLeft()<=0&&META.timer.paused==null)finishTimer();
const idle=window.requestIdleCallback||(f=>setTimeout(f,200));
idle(()=>{
  if(META.lastSnap!==todayS()){snapshot('daily');META.lastSnap=todayS();persist()}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(e=>log('warn','app','Offline support failed to start',e.message));
  sync();
});
// re-render at midnight & keep the now-line fresh
setInterval(()=>{if(document.visibilityState==='visible'&&Date.now()-lastRender>6e4&&!$('#sheet').classList.contains('open'))render(true)},6e4);
</script>
